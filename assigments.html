<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigment</title>
</head>
<body backgroundimage="studenthub/62351907-9b4c-4cbf-a53b-251e573591b8.png?w=2000">

    <h3>Assignment Page</h3>
    <form>
        <label>Student Name:</label>
        <input type="text" placeholder="Enter Student Name" required>
        <br><br>
        <label>Roll Number:</label>
        <input type="text" placeholder="Enter Roll Number" required>
        <br><br>
        <label>Assignment Title:</label>
        <input type="text" placeholder="Enter Assignment Title" required>
        <br><br>
        <label>Submission Date:</label>
        <input type="date" required>
        <br><br>
        <label>Upload Assignment:</label>
        <input type="file" required>
        <br><br>

        <button type="submit">Submit Assignment</button>


        
    </form>
</body>
</html>
