<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body{
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            color: darkblue;
        }

        .box{
            width: 500px;
            margin: 30px auto;
            background-color: white;
            border: 2px solid black;
            padding: 20px;
        }

        h2, h3{
            color: black;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th{
            background-color: green;
            color: white;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tr:hover{
            background-color: lightgray;
        }
    </style>

</head>

<body>

    <div class="box">

        <h1>Student Result</h1>

        <h2>Student Name: Radhe Kalariya </h2>

        <table>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>HTML</td>
                <td>85</td>
                <td>A</td>
            </tr>

            <tr>
                <td>CSS</td>
                <td>80</td>
                <td>A</td>
            </tr>

            <tr>
                <td>JavaScript</td>
                <td>75</td>
                <td>B</td>
            </tr>

            <tr>
                <td>C Programming</td>
                <td>90</td>
                <td>A+</td>
            </tr>

        </table>

        <h3>Total Marks: 330 / 400</h3>
        <h3>Result: Pass</h3>

    </div>

</body>
</html>
