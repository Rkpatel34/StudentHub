<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>

<style>
body{
    background:lightblue;
    font-family:Arial;
    transition:.3s;
}
h1{text-align:center;color:darkblue}
.form-box{
    width:350px;background:white;margin:30px auto;
    padding:20px;border:2px solid black;
}
label{font-weight:bold}
input,select{
    width:100%;padding:8px;margin:5px 0 15px;
    box-sizing:border-box;
}
input[type=radio]{width:auto}
button{
    width:100%;padding:10px;margin:5px 0;
    background:green;color:white;border:0;cursor:pointer;
}
#message{text-align:center;font-weight:bold;margin-top:10px}
.success{color:green}
.error{color:red}
.dark{background:#222;color:white}
.dark .form-box{background:#444}
.dark h1{color:cyan}
</style>
</head>

<body>

<h1>Registration Form</h1>

<div class="form-box">

<button onclick="theme()">Dark / Light Mode</button>

<form id="form">

<label>Full Name</label>
<input id="name" placeholder="Enter your name">

<label>Email</label>
<input id="email" placeholder="Enter your email">

<label>Phone Number</label>
<input id="phone" placeholder="Enter phone number">

<label>Username</label>
<input id="username" placeholder="Enter username">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<label>Confirm Password</label>
<input type="password" id="confirm" placeholder="Confirm password">

<label>Gender</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<br><br>

<label>Course</label>
<select id="course">
<option value="">Select Course</option>
<option>Web Development</option>
<option>Data Science</option>
<option>Cyber Security</option>
<option>Programming</option>
</select>

<button type="button" onclick="register()">Register</button>
<button type="button" onclick="clearForm()">Clear</button>

<div id="message"></div>

</form>
</div>

<script>

/* Theme */
function theme(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",
    document.body.classList.contains("dark")?"dark":"light");
}

if(localStorage.getItem("theme")=="dark")
    document.body.classList.add("dark");


/* Registration */
function register(){

    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;
    let phone=document.getElementById("phone").value;
    let username=document.getElementById("username").value;
    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirm").value;
    let course=document.getElementById("course").value;
    let gender=document.querySelector("input[name=gender]:checked");
    let msg=document.getElementById("message");

    if(name==""||email==""||phone==""||username==""||
       password==""||confirm==""){
        msg.innerHTML="Please fill all details.";
        msg.className="error";
        return;
    }

    if(!email.includes("@")){
        msg.innerHTML="Enter a valid email.";
        msg.className="error";
        return;
    }

    if(password.length<6){
        msg.innerHTML="Password must be 6 characters.";
        msg.className="error";
        return;
    }

    if(password!=confirm){
        msg.innerHTML="Passwords do not match.";
        msg.className="error";
        return;
    }

    if(!gender){
        msg.innerHTML="Please select gender.";
        msg.className="error";
        return;
    }

    if(course==""){
        msg.innerHTML="Please select a course.";
        msg.className="error";
        return;
    }

    msg.innerHTML="Registration Successful! ✅";
    msg.className="success";
}


/* Clear */
function clearForm(){
    document.getElementById("form").reset();
    document.getElementById("message").innerHTML="";
}

</script>

</body>
</html>
