<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment</title>

<style>
body{
    background-color:lightblue;
    font-family:Arial,sans-serif;
    transition:.3s;
}
h2{text-align:center;color:darkblue}
.box{
    width:350px;background:white;margin:30px auto;
    padding:20px;border:2px solid black;border-radius:8px;
}
label{font-weight:bold}
input{
    width:100%;padding:8px;margin:5px 0 15px;
    box-sizing:border-box;
}
button{
    width:100%;padding:10px;margin:5px 0;
    background:blue;color:white;border:0;
    cursor:pointer;border-radius:5px;
}
button:hover{background:darkblue}
#message,#help{
    display:none;padding:10px;margin-top:10px;
    text-align:center;
}
#message{background:lightgreen;color:green}
#help{background:lightyellow;color:black}
#count,#fileName{font-size:13px;color:green}
.dark{background:#222;color:white}
.dark .box{background:#444;border-color:white}
.dark h2{color:cyan}
.dark input{background:#ddd;color:black}
</style>
</head>

<body>

<div class="box">

<h2>Assignment Page</h2>

<button onclick="changeTheme()">Dark / Light Mode</button>
<button onclick="showHelp()">Help</button>

<form id="form">

<label>Student Name:</label>
<input type="text" id="name" placeholder="Enter Student Name">

<label>Roll Number:</label>
<input type="text" id="roll" placeholder="Enter Roll Number">

<label>Assignment Title:</label>
<input type="text" id="title" maxlength="50"
placeholder="Enter Assignment Title">
<p id="count">Characters: 0 / 50</p>

<label>Submission Date:</label>
<input type="date" id="date">

<label>Upload Assignment:</label>
<input type="file" id="file">
<p id="fileName"></p>

<button type="button" onclick="submitAssignment()">
Submit Assignment
</button>

<button type="button" onclick="clearForm()">
Clear Form
</button>

</form>

<div id="message">Assignment submitted successfully! ✅</div>

<div id="help">
<b>Instructions</b>
<p>1. Enter student details.</p>
<p>2. Enter assignment title.</p>
<p>3. Select date and upload file.</p>
<p>4. Click Submit.</p>
</div>

</div>

<script>

// Load saved theme
if(localStorage.getItem("theme")=="dark")
    document.body.classList.add("dark");

// Dark / Light Mode
function changeTheme(){
    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark"))
        localStorage.setItem("theme","dark");
    else
        localStorage.setItem("theme","light");
}

// Submit Assignment
function submitAssignment(){

    let name=document.getElementById("name").value;
    let roll=document.getElementById("roll").value;
    let title=document.getElementById("title").value;
    let date=document.getElementById("date").value;
    let file=document.getElementById("file").value;

    if(name=="" || roll=="" || title=="" || date=="" || file==""){
        alert("Please fill all fields!");
        return;
    }

    document.getElementById("message").style.display="block";
    document.getElementById("message").innerHTML=
        "Assignment submitted successfully! ✅";
}

// Clear Form
function clearForm(){
    document.getElementById("form").reset();
    document.getElementById("message").style.display="none";
    document.getElementById("fileName").innerHTML="";
    document.getElementById("count").innerHTML="Characters: 0 / 50";
}

// Character Counter
document.getElementById("title").onkeyup=function(){
    document.getElementById("count").innerHTML=
        "Characters: "+this.value.length+" / 50";
};

// Show File Name
document.getElementById("file").onchange=function(){
    if(this.files.length>0)
        document.getElementById("fileName").innerHTML=
        "Selected file: "+this.files[0].name;
};

// Help
function showHelp(){
    let help=document.getElementById("help");

    if(help.style.display=="block")
        help.style.display="none";
    else
        help.style.display="block";
}

</script>

</body>
</html>
