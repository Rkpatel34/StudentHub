<!DOCTYPE html>
<html>

<head>

<title>Courses</title>

<style>

body{
    background-color:lightblue;
    font-family:Arial,sans-serif;
    transition:.3s;
}

h1{
    text-align:center;
    color:darkblue;
}

.box{
    width:400px;
    margin:30px auto;
    background-color:white;
    border:2px solid black;
    padding:20px;
    border-radius:8px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    margin:5px 0;
    background-color:blue;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background-color:darkblue;
}

ul{
    padding-left:20px;
}

li{
    padding:10px;
    border-bottom:1px solid gray;
    cursor:pointer;
}

li:hover{
    background-color:lightgray;
}

#message{
    display:none;
    background-color:lightgreen;
    color:darkgreen;
    padding:10px;
    margin-top:10px;
    text-align:center;
}

/* Dark Mode */

.dark{
    background-color:#222;
    color:white;
}

.dark .box{
    background-color:#444;
    border-color:white;
}

.dark h1{
    color:cyan;
}

.dark input{
    background-color:#ddd;
    color:black;
}
</style>

</head>

<body>

<div class="box">

<h1>Our Courses</h1>

<!-- Dark Mode -->

<button onclick="changeTheme()">
Dark / Light Mode
</button>

<!-- Search -->
<input type="text"
       id="search"
       placeholder="Search Course..."
       onkeyup="searchCourse()">

<button onclick="clearSearch()">
Clear Search
</button>

<p>
Total Courses:
<b id="courseCount">10</b>
</p>

<ul id="courses">
<li onclick="selectCourse(this)">Web Development</li>
<li onclick="selectCourse(this)">App Development</li>
<li onclick="selectCourse(this)">Data Science</li>
<li onclick="selectCourse(this)">Artificial Intelligence</li>
<li onclick="selectCourse(this)">Machine Learning</li>
<li onclick="selectCourse(this)">Cyber Security</li>
<li onclick="selectCourse(this)">Cloud Computing</li>
<li onclick="selectCourse(this)">Graphic Design</li>
<li onclick="selectCourse(this)">Digital Marketing</li>
<li onclick="selectCourse(this)">Programming in C/C++</li>
</ul>
<div id="message"></div>
</div>
<script>

if(localStorage.getItem("theme")=="dark"){

    document.body.classList.add("dark");

}

function changeTheme(){

    document.body.classList.toggle("dark");


    if(document.body.classList.contains("dark")){

        localStorage.setItem("theme","dark");

    }

    else{

        localStorage.setItem("theme","light");

    }

}
function searchCourse(){

    let input=document.getElementById("search")
        .value.toLowerCase();

    let courses=document.getElementById("courses")
        .getElementsByTagName("li");


    for(let i=0;i<courses.length;i++){

        let name=courses[i].innerHTML.toLowerCase();

        if(name.includes(input)){

            courses[i].style.display="block";

        }

        else{

            courses[i].style.display="none";
        }

    }

}
function clearSearch(){

    document.getElementById("search").value="";

    searchCourse();

}
function selectCourse(course){

    document.getElementById("message").style.display="block";

    document.getElementById("message").innerHTML=
        "You selected: <b>"+course.innerHTML+"</b>";

}
</script>
</body>
</html>
