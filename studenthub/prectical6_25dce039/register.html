
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>

        body {
            background: lightblue;
            font-family: Arial;
            transition: .3s;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .form-box {
            width: 350px;
            background: white;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 5px;
            box-sizing: border-box;
        }

        input[type=radio],
        input[type=checkbox] {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: green;
            color: white;
            border: 0;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
            font-size: 13px;
            display: block;
            margin-bottom: 10px;
        }

        #strength {
            font-size: 13px;
            font-weight: bold;
        }

        .dark {
            background: #222;
            color: white;
        }

        .dark .form-box {
            background: #444;
        }

        .dark h1 {
            color: cyan;
        }

        .dark input,
        .dark select {
            background: #555;
            color: white;
        }

    </style>

</head>


<body>

    <h1>Registration Form</h1>

    <div class="form-box">

        <button type="button" onclick="theme()">
            Dark / Light Mode
        </button>

        <form id="form">

            <!-- Full Name -->

            <label for="name">Full Name</label>

            <input type="text" id="name"
                   placeholder="Enter your name">

            <span id="nameError" class="error"></span>


            <!-- Email -->

            <label for="email">Email</label>

            <input type="email" id="email"
                   placeholder="Enter your email">

            <span id="emailError" class="error"></span>


            <!-- Phone -->

            <label for="phone">Phone Number</label>

            <input type="tel" id="phone"
                   placeholder="Enter phone number"
                   maxlength="10">

            <span id="phoneError" class="error"></span>


            <!-- Username -->

            <label for="username">Username</label>

            <input type="text" id="username"
                   placeholder="Enter username">

            <span id="usernameError" class="error"></span>


            <!-- Password -->

            <label for="password">Password</label>

            <input type="password" id="password"
                   placeholder="Enter password">

            <span id="passwordError" class="error"></span>

            <p id="strength"></p>


            <!-- Confirm Password -->

            <label for="confirm">Confirm Password</label>

            <input type="password" id="confirm"
                   placeholder="Confirm password">

            <span id="confirmError" class="error"></span>


            <!-- Gender -->

            <label>Gender</label><br>

            <input type="radio"
                   name="gender"
                   value="Male"
                   id="male">

            <label for="male">Male</label>

            <input type="radio"
                   name="gender"
                   value="Female"
                   id="female">

            <label for="female">Female</label>

            <span id="genderError" class="error"></span>


            <!-- Course -->

            <label for="course">Course</label>

            <select id="course">

                <option value="">Select Course</option>

                <option value="Web Development">
                    Web Development
                </option>

                <option value="Data Science">
                    Data Science
                </option>

                <option value="Cyber Security">
                    Cyber Security
                </option>

                <option value="Programming">
                    Programming
                </option>

            </select>

            <span id="courseError" class="error"></span>


            <!-- Year -->

            <label for="year">Year</label>

            <select id="year">

                <option value="">Select Year</option>

                <option value="1">First Year</option>

                <option value="2">Second Year</option>

                <option value="3">Third Year</option>

                <option value="4">Fourth Year</option>

            </select>

            <span id="yearError" class="error"></span>


            <!-- Terms -->

            <input type="checkbox" id="terms">

            <label for="terms">
                I accept terms and conditions
            </label>

            <span id="termsError" class="error"></span>


            <!-- Buttons -->

            <button type="submit">
                Register
            </button>

            <button type="button" onclick="clearForm()">
                Clear
            </button>

            <div id="message"></div>

        </form>

    </div>


    <script>

        /* Theme */

        function theme() {

            document.body.classList.toggle("dark");

            localStorage.setItem(
                "theme",
                document.body.classList.contains("dark")
                    ? "dark"
                    : "light"
            );

        }


        if (localStorage.getItem("theme") == "dark") {

            document.body.classList.add("dark");

        }


        /* Password Strength */

        document.getElementById("password")
            .addEventListener("input", function () {

                let password = this.value;

                let strength = document.getElementById("strength");

                if (password.length == 0) {

                    strength.innerHTML = "";

                }

                else if (password.length < 6) {

                    strength.innerHTML = "Weak Password";
                    strength.style.color = "red";

                }

                else if (password.length < 8) {

                    strength.innerHTML = "Medium Password";
                    strength.style.color = "orange";

                }

                else {

                    strength.innerHTML = "Strong Password";
                    strength.style.color = "green";

                }

            });


        /* Registration */

        document.getElementById("form")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                let name = document.getElementById("name").value.trim();

                let email = document.getElementById("email").value.trim();

                let phone = document.getElementById("phone").value.trim();

                let username =
                    document.getElementById("username").value.trim();

                let password =
                    document.getElementById("password").value;

                let confirm =
                    document.getElementById("confirm").value;

                let course =
                    document.getElementById("course").value;

                let year =
                    document.getElementById("year").value;

                let gender =
                    document.querySelector(
                        "input[name=gender]:checked"
                    );

                let terms =
                    document.getElementById("terms").checked;


                /* Clear Errors */

                document.querySelectorAll(".error")
                    .forEach(function (error) {

                        error.innerHTML = "";

                    });

                document.getElementById("message").innerHTML = "";

                let valid = true;


                /* Name Regex */

                let namePattern = /^[A-Za-z ]{3,50}$/;

                if (!namePattern.test(name)) {

                    document.getElementById("nameError").innerHTML =
                        "Enter a valid name (3-50 letters).";

                    valid = false;

                }


                /* Email Regex */

                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email)) {

                    document.getElementById("emailError").innerHTML =
                        "Enter a valid email.";

                    valid = false;

                }


                /* Phone Regex */

                let phonePattern = /^[6-9][0-9]{9}$/;

                if (!phonePattern.test(phone)) {

                    document.getElementById("phoneError").innerHTML =
                        "Enter a valid 10-digit phone number.";

                    valid = false;

                }


                /* Username Regex */

                let usernamePattern =
                    /^[A-Za-z][A-Za-z0-9_]{3,15}$/;

                if (!usernamePattern.test(username)) {

                    document.getElementById("usernameError").innerHTML =
                        "Username: 4-16 characters, starts with a letter.";

                    valid = false;

                }


                /* Password Regex */

                let passwordPattern =
                    /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@#$!%]).{8,}$/;

                if (!passwordPattern.test(password)) {

                    document.getElementById("passwordError").innerHTML =
                        "Use 8+ characters, uppercase, lowercase, number and special character.";

                    valid = false;

                }


                /* Confirm Password */

                if (password != confirm || confirm == "") {

                    document.getElementById("confirmError").innerHTML =
                        "Passwords do not match.";

                    valid = false;

                }


                /* Gender */

                if (!gender) {

                    document.getElementById("genderError").innerHTML =
                        "Please select gender.";

                    valid = false;

                }


                /* Course */

                if (course == "") {

                    document.getElementById("courseError").innerHTML =
                        "Please select a course.";

                    valid = false;

                }


                /* Year */

                if (year == "") {

                    document.getElementById("yearError").innerHTML =
                        "Please select year.";

                    valid = false;

                }


                /* Terms */

                if (!terms) {

                    document.getElementById("termsError").innerHTML =
                        "Please accept terms and conditions.";

                    valid = false;

                }


                /* Final Result */

                if (valid) {

                    document.getElementById("message").innerHTML =
                        "Registration Successful! ✅";

                    document.getElementById("message")
                        .className = "success";

                    document.getElementById("form").reset();

                    document.getElementById("strength").innerHTML = "";

                }

            });


        /* Clear Form */

        function clearForm() {

            document.getElementById("form").reset();

            document.getElementById("message").innerHTML = "";

            document.getElementById("strength").innerHTML = "";

            document.querySelectorAll(".error")
                .forEach(function (error) {

                    error.innerHTML = "";

                });

        }

    </script>

</body>

</html>
