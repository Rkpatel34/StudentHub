
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>

        body {
            background: lightblue;
            font-family: Arial;
            transition: .3s;
        }

        form {
            background: white;
            width: 300px;
            margin: 70px auto;
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            height: 30px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        button {
            width: 100%;
            height: 35px;
            margin-top: 8px;
            background: blue;
            color: white;
            border: 0;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        h2 {
            text-align: center;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .dark {
            background: #222;
            color: white;
        }

        .dark form {
            background: #444;
        }

        .dark h2 {
            color: cyan;
        }

        .dark input {
            background: #555;
            color: white;
        }

        .error-text {
            color: red;
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }

        a {
            color: blue;
        }

    </style>

</head>


<body>

    <form id="loginForm">

        <h2>Login</h2>


        <!-- Dark Mode -->

        <button type="button" onclick="theme()">
            Dark / Light Mode
        </button>

        <br><br>


        <!-- Username -->

        <label for="username">Username:</label>

        <input type="text"
               id="username"
               placeholder="Enter Username">

        <span id="usernameError"
              class="error-text"></span>

        <br>


        <!-- Password -->

        <label for="password">Password:</label>

        <input type="password"
               id="password"
               placeholder="Enter Password">

        <span id="passwordError"
              class="error-text"></span>


        <!-- Show Password -->

        <br>

        <label>
            <input type="checkbox"
                   onclick="showPassword()">

            Show Password
        </label>


        <br><br>


        <!-- Login -->

        <button type="submit">
            Login
        </button>


        <!-- Clear -->

        <button type="button"
                onclick="clearForm()">

            Clear

        </button>


        <!-- Message -->

        <p id="message"></p>


        <a href="#">
            Forgot Password?
        </a>


        <p>Don't have an account?</p>

        <a href="register.html">
            Register here
        </a>

    </form>


    <script>


        /* Dark Mode */

        function theme() {

            document.body.classList.toggle("dark");

            localStorage.setItem(
                "theme",
                document.body.classList.contains("dark")
                    ? "dark"
                    : "light"
            );

        }


        if (localStorage.getItem("theme") == "dark") {

            document.body.classList.add("dark");

        }


        /* Show Password */

        function showPassword() {

            let password =
                document.getElementById("password");

            password.type =
                password.type == "password"
                    ? "text"
                    : "password";

        }


        /* Login Validation */

        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let username =
                    document.getElementById("username").value.trim();

                let password =
                    document.getElementById("password").value;

                let message =
                    document.getElementById("message");


                // Clear old errors

                document.getElementById("usernameError")
                    .innerHTML = "";

                document.getElementById("passwordError")
                    .innerHTML = "";

                message.innerHTML = "";


                let valid = true;


                // Username Regex

                let user =
                    /^[A-Za-z0-9_]{3,15}$/;


                // Password Regex

                let pass =
                    /^(?=.*[A-Za-z])(?=.*[0-9]).{5,}$/;


                // Username Empty

                if (username == "") {

                    document.getElementById("usernameError")
                        .innerHTML =
                        "Please enter username.";

                    valid = false;

                }

                else if (!user.test(username)) {

                    document.getElementById("usernameError")
                        .innerHTML =
                        "Username must be 3-15 characters.";

                    valid = false;

                }


                // Password Empty

                if (password == "") {

                    document.getElementById("passwordError")
                        .innerHTML =
                        "Please enter password.";

                    valid = false;

                }

                else if (!pass.test(password)) {

                    document.getElementById("passwordError")
                        .innerHTML =
                        "Password needs a letter, number and 5 characters.";

                    valid = false;

                }


                // Stop if invalid

                if (!valid) {

                    message.innerHTML =
                        "Please fix the errors.";

                    message.className = "error";

                    return;

                }


                // Demo Login

                if (username == "admin" &&
                    password == "12345") {

                    message.innerHTML =
                        "Login Successful! ";

                    message.className = "success";

                }

                else {

                    message.innerHTML =
                        "Invalid Username or Password.";

                    message.className = "error";

                }

            });


        /* Clear Form */

        function clearForm() {

            document.getElementById("loginForm").reset();

            document.getElementById("message").innerHTML = "";

            document.getElementById("usernameError")
                .innerHTML = "";

            document.getElementById("passwordError")
                .innerHTML = "";

        }

    </script>

</body>

</html>
