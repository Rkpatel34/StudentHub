<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profiles</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            transition: 0.3s;
            text-align: center;
        }

        .box {
            width: 750px;
            max-width: 95%;
            margin: 25px auto;
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: darkblue;
            margin-bottom: 5px;
        }

        p {
            color: gray;
        }

        /* Navigation Links and Buttons */
        .btn {
            padding: 8px 14px;
            margin: 4px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .btn:hover {
            background-color: darkblue;
        }

        .btn-theme {
            background-color: green;
        }

        .btn-theme:hover {
            background-color: darkgreen;
        }

        /* Controls: Search, Filter, Sort */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        input, select {
            padding: 8px;
            border: 1px solid black;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Students Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: blue;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Pagination */
        .pagination {
            margin-top: 20px;
        }

        .pagination button {
            padding: 6px 12px;
            margin: 2px;
            border: 1px solid blue;
            background-color: white;
            color: blue;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .pagination button.active {
            background-color: blue;
            color: white;
        }

        .pagination button:disabled {
            background-color: #ddd;
            border-color: #aaa;
            color: #888;
            cursor: not-allowed;
        }

        /* Status Messages */
        #message {
            margin: 15px;
            font-weight: bold;
        }

        /* Dark Mode */
        .dark {
            background-color: #222;
            color: white;
        }

        .dark .box {
            background-color: #444;
            border-color: white;
        }

        .dark h1 {
            color: cyan;
        }

        .dark p {
            color: white;
        }

        .dark th {
            background-color: darkblue;
        }

        .dark td {
            border-color: white;
            color: white;
        }

        .dark tr:hover {
            background-color: #555;
        }

        .dark input, .dark select {
            background-color: #666;
            color: white;
            border-color: white;
        }

        .dark .pagination button {
            background-color: #555;
            color: white;
            border-color: white;
        }

        .dark .pagination button.active {
            background-color: cyan;
            color: black;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Student Profiles</h1>
    <p>Rendering external JSON data using Fetch API with Search, Filter & Pagination</p>

    <!-- Navigation Buttons -->
    <div>
        <a href="index.html" class="btn">Home</a>
        <a href="admin.html" class="btn">Admin Panel</a>
        <button class="btn btn-theme" onclick="changeTheme()">Dark / Light Mode</button>
    </div>

    <!-- Controls (Search, Filter, Sort) -->
    <div class="controls">
        <!-- Search Input -->
        <input type="text" id="search" placeholder="Search by name or city..." onkeyup="filterStudents()">

        <!-- Department Filter -->
        <select id="department" onchange="filterStudents()">
            <option value="All">All Departments</option>
            <option value="Computer">Computer</option>
            <option value="IT">IT</option>
            <option value="Civil">Civil</option>
            <option value="AI">AI</option>
        </select>

        <!-- Sorting -->
        <select id="sort" onchange="filterStudents()">
            <option value="default">Default Order</option>
            <option value="name-asc">Name (A to Z)</option>
            <option value="name-desc">Name (Z to A)</option>
            <option value="cgpa-desc">CGPA (High to Low)</option>
            <option value="cgpa-asc">CGPA (Low to High)</option>
        </select>
    </div>

    <!-- Loading / Error Message -->
    <div id="message">Loading students...</div>

    <!-- Student Data Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Roll No</th>
                <th>Name</th>
                <th>Department</th>
                <th>CGPA</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="studentTable">
            <!-- Student rows will be added here dynamically by JavaScript -->
        </tbody>
    </table>

    <!-- Pagination Buttons -->
    <div class="pagination" id="pagination"></div>

</div>

<!-- JavaScript Logic -->
<script>
    // Variables
    let allStudents = [];      // Stores all 5 students fetched from JSON
    let filteredStudents = []; // Stores filtered and searched students
    let currentPage = 1;       // Current page number
    let studentsPerPage = 2;   // Show 2 students per page (for 5 students total)

    // Check saved theme
    if (localStorage.getItem("theme") == "dark") {
        document.body.classList.add("dark");
    }

    // Dark / Light Mode Toggle
    function changeTheme() {
        document.body.classList.toggle("dark");
        if (document.body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
        } else {
            localStorage.setItem("theme", "light");
        }
    }

    // Step 1: Fetch 5 Students from students.json using Fetch API
    function fetchStudents() {
        document.getElementById("message").innerText = "Loading students data...";

        fetch("students.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                return response.json();
            })
            .then(data => {
                allStudents = data;
                filteredStudents = data;

                // Save in LocalStorage (Advanced Extension)
                localStorage.setItem("savedStudents", JSON.stringify(data));

                document.getElementById("message").innerText = "";
                renderPage();
            })
            .catch(error => {
                console.log(error);
                // If offline or fetch fails, load from LocalStorage cache
                let cached = localStorage.getItem("savedStudents");
                if (cached) {
                    allStudents = JSON.parse(cached);
                    filteredStudents = allStudents;
                    document.getElementById("message").innerText = "Loaded from offline cache!";
                    renderPage();
                } else {
                    document.getElementById("message").innerText = "Error loading students.json!";
                }
            });
    }

    // Step 2: Search, Filter, and Sort Students
    function filterStudents() {
        let searchValue = document.getElementById("search").value.toLowerCase();
        let selectedDept = document.getElementById("department").value;
        let selectedSort = document.getElementById("sort").value;

        // Filter by Search text and Department
        filteredStudents = allStudents.filter(student => {
            let matchesSearch = student.name.toLowerCase().includes(searchValue) ||
                                student.city.toLowerCase().includes(searchValue);
            let matchesDept = (selectedDept == "All") || (student.department == selectedDept);

            return matchesSearch && matchesDept;
        });

        // Sort students
        if (selectedSort == "name-asc") {
            filteredStudents.sort((a, b) => a.name.localeCompare(b.name));
        } else if (selectedSort == "name-desc") {
            filteredStudents.sort((a, b) => b.name.localeCompare(a.name));
        } else if (selectedSort == "cgpa-desc") {
            filteredStudents.sort((a, b) => b.cgpa - a.cgpa);
        } else if (selectedSort == "cgpa-asc") {
            filteredStudents.sort((a, b) => a.cgpa - b.cgpa);
        }

        // Reset to first page after search/filter
        currentPage = 1;
        renderPage();
    }

    // Step 3: Display current page students and pagination buttons
    function renderPage() {
        let tableBody = document.getElementById("studentTable");
        let paginationDiv = document.getElementById("pagination");
        tableBody.innerHTML = "";

        if (filteredStudents.length == 0) {
            tableBody.innerHTML = "<tr><td colspan='6'>No students found.</td></tr>";
            paginationDiv.innerHTML = "";
            return;
        }

        // Calculate slice for current page
        let start = (currentPage - 1) * studentsPerPage;
        let end = start + studentsPerPage;
        let pageStudents = filteredStudents.slice(start, end);

        // Add rows to table
        pageStudents.forEach(student => {
            let row = `
                <tr>
                    <td>${student.id}</td>
                    <td><b>${student.rollNo}</b></td>
                    <td>${student.name}</td>
                    <td>${student.department}</td>
                    <td>${student.cgpa}</td>
                    <td>${student.city}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        // Render Pagination buttons
        let totalPages = Math.ceil(filteredStudents.length / studentsPerPage);
        let paginationHTML = "";

        // Previous button
        paginationHTML += `<button onclick="goToPage(${currentPage - 1})" ${currentPage == 1 ? "disabled" : ""}>Prev</button>`;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            paginationHTML += `<button class="${i == currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }

        // Next button
        paginationHTML += `<button onclick="goToPage(${currentPage + 1})" ${currentPage == totalPages ? "disabled" : ""}>Next</button>`;

        paginationDiv.innerHTML = paginationHTML;
    }

    // Change Page
    function goToPage(page) {
        currentPage = page;
        renderPage();
    }

    // Load data when page loads
    window.onload = fetchStudents;
</script>

</body>
</html>
